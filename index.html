<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAIZEN - Gestão de Atividades</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            animation: fadeIn 0.6s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .logo-box {
            background: rgba(255, 255, 255, 0.95);
            width: 100px;
            height: 100px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            font-size: 48px;
            animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        @keyframes slideDown {
            from { transform: translateY(-30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        h1 {
            color: #fff;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }
        
        p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 16px;
            margin-bottom: 30px;
            font-weight: 400;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .dots {
            color: rgba(255, 255, 255, 0.7);
            font-size: 18px;
            margin-top: 15px;
            letter-spacing: 3px;
            animation: blink 1.4s infinite;
        }
        
        @keyframes blink {
            0%, 20%, 50%, 80%, 100% { opacity: 1; }
            40% { opacity: 0.4; }
            60% { opacity: 0.7; }
        }
        
        .footer {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-box">📋</div>
        <h1>KAIZEN</h1>
        <p>Gestão de Atividades & Performance</p>
        <div class="spinner"></div>
        <div class="dots">●●●</div>
    </div>
    
    <div class="footer">
        Carregando aplicativo...
    </div>
    
    <script>
        // Redireciona para o documento após 1.5 segundos
        setTimeout(() => {
            window.location.href = 'Documento de Santoro.html';
        }, 1500);
        
        // Fallback: redireciona se algo der errado
        window.addEventListener('error', () => {
            window.location.href = 'Documento de Santoro.html';
        });
    </script>
</body>
</html>
